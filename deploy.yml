name: Deploy Multi-Tech Docker Application

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: [self-hosted, linux]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Docker
        run: docker --version

      - name: Check Docker Compose
        run: docker compose version

      - name: Stop old containers
        run: docker compose down

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      - name: Verify Node.js application
        run: curl -f http://localhost:3000

      - name: Verify Angular application
        run: curl -f http://localhost:4200

      - name: Verify Java application
        run: curl -f http://localhost:8080

      - name: Verify Python application
        run: curl -f http://localhost:5000
